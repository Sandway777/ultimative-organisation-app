<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notizblock</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#201E1A">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EEE2; --card:#FAF7EF; --ink:#2B2A28; --ink-soft:#726C63; --line:#DFD7C4;
  --sidebar-bg:#201E1A; --sidebar-line:rgba(255,255,255,.1);
  --privat:#B5563A; --business:#2B6E6B; --uni:#4A5A8C; --danger:#A8425A;
  --privat-bg:#F3E2DA; --business-bg:#DEEAE8; --uni-bg:#E2E5EF;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:'IBM Plex Sans',sans-serif;color:var(--ink);background:var(--sidebar-bg);}
.app{display:flex;height:100vh;width:100%;}

/* ---------- Sidebar ---------- */
.sidebar{width:250px;flex-shrink:0;background:var(--sidebar-bg);color:#fff;display:flex;flex-direction:column;overflow-y:auto;}
.sidebar-header{padding:18px 16px 10px;}
.sidebar-title{font-family:'Fraunces',serif;font-weight:600;font-style:italic;font-size:1.3rem;}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 4px;}
.chip{border:none;border-radius:20px;padding:5px 11px;font-size:0.74rem;font-family:'IBM Plex Sans',sans-serif;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);cursor:pointer;transition:.15s;}
.chip:hover{background:rgba(255,255,255,.2);}
.chip.active{background:#fff;color:var(--sidebar-bg);font-weight:600;}
.chip.active.f-privat{background:var(--privat);color:#fff;}
.chip.active.f-business{background:var(--business);color:#fff;}
.chip.active.f-uni{background:var(--uni);color:#fff;}

.pinned{margin:12px 12px 4px;padding:11px 12px;border-radius:9px;background:rgba(255,255,255,.06);
  cursor:pointer;border:1px solid var(--sidebar-line);transition:.15s;}
.pinned:hover{background:rgba(255,255,255,.12);}
.pinned.active{background:var(--card);}
.pinned.active .pinned-title{color:var(--ink);}
.pinned-title{font-size:0.9rem;font-weight:600;color:#fff;}
.pinned-sub{font-size:0.7rem;color:rgba(255,255,255,.5);margin-top:2px;}
.pinned.active .pinned-sub{color:var(--ink-soft);}

.add-row{padding:6px 12px 8px;}
.add-btn-full{width:100%;border:1px dashed rgba(255,255,255,.3);background:none;color:rgba(255,255,255,.75);
  border-radius:8px;padding:8px;font-size:0.82rem;cursor:pointer;font-family:inherit;}
.add-btn-full:hover{background:rgba(255,255,255,.08);}

.new-form{display:none;flex-direction:column;gap:6px;padding:0 12px 12px;}
.new-form.show{display:flex;}
.new-form input,.new-form select{border:none;border-radius:6px;padding:8px 9px;font-size:0.83rem;
  font-family:inherit;background:rgba(255,255,255,.95);color:var(--ink);}
.new-form .daterow{display:flex;gap:6px;}
.new-form .daterow input{flex:1;}
.new-form-confirm{border:none;border-radius:6px;background:#fff;color:var(--sidebar-bg);font-weight:600;
  padding:7px 10px;font-size:0.8rem;cursor:pointer;}
.bereich-picker{display:flex;gap:5px;flex-wrap:wrap;}
.bp-btn{border:1.5px solid rgba(255,255,255,.25);background:none;color:rgba(255,255,255,.8);border-radius:20px;
  padding:5px 11px;font-size:0.76rem;font-family:inherit;cursor:pointer;transition:.15s;}
.bp-btn.active{color:#fff;border-color:transparent;}
.bp-btn.privat.active{background:var(--privat);} .bp-btn.business.active{background:var(--business);}
.bp-btn.uni.active{background:var(--uni);} .bp-btn.none.active{background:rgba(255,255,255,.25);}

.zettel-list{flex:1;overflow-y:auto;padding:2px 8px 10px;}
.zettel-item{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;transition:.15s;
  display:flex;align-items:center;gap:8px;}
.zettel-item:hover{background:rgba(255,255,255,.08);}
.zettel-item.active{background:var(--card);}
.dot-row{display:flex;gap:2px;flex-shrink:0;}
.dot{width:8px;height:8px;border-radius:50%;}
.dot.privat{background:var(--privat);} .dot.business{background:var(--business);} .dot.uni{background:var(--uni);}
.dot.none{background:rgba(255,255,255,.3);}
.zettel-info{flex:1;min-width:0;}
.zettel-title{font-size:0.88rem;font-weight:600;color:rgba(255,255,255,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.zettel-item.active .zettel-title{color:var(--ink);}
.zettel-meta{font-size:0.68rem;color:rgba(255,255,255,.5);margin-top:1px;}
.zettel-item.active .zettel-meta{color:var(--ink-soft);}
.type-icon{font-size:0.85rem;flex-shrink:0;}
.sidebar-empty{padding:10px 12px;font-size:0.78rem;color:rgba(255,255,255,.5);font-style:italic;}

.sidebar-footer{flex-shrink:0;padding:10px 14px 14px;border-top:1px solid var(--sidebar-line);}
.backup-row{display:flex;gap:6px;}
.backup-btn{flex:1;border:none;border-radius:6px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.9);
  font-size:0.74rem;font-family:inherit;padding:7px 5px;cursor:pointer;}
.backup-btn:hover{background:rgba(255,255,255,.22);}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;min-width:0;}
.main-scroll{flex:1;overflow-y:auto;padding:30px 34px;}
.content{max-width:760px;}

.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:4px;}
h1.zt{font-family:'Fraunces',serif;font-weight:600;font-size:1.9rem;margin:0;color:var(--ink);word-break:break-word;}
.head-meta{font-size:0.78rem;color:var(--ink-soft);margin-bottom:16px;font-family:'IBM Plex Mono',monospace;}
.del-btn{border:none;background:none;color:var(--ink-soft);font-size:1.05rem;cursor:pointer;padding:4px 6px;border-radius:6px;flex-shrink:0;}
.del-btn:hover{background:#eee0dd;color:var(--danger);}

.bereich-tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:0.68rem;font-weight:600;
  letter-spacing:.03em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;margin-left:8px;color:#fff;}
.bereich-tag.privat{background:var(--privat);} .bereich-tag.business{background:var(--business);} .bereich-tag.uni{background:var(--uni);}

.content.bereich-privat h1.zt{color:var(--privat);}
.content.bereich-privat .input-row input:focus{border-bottom-color:var(--privat);}
.content.bereich-privat .mini-checkbox svg{stroke:var(--privat);}
.content.bereich-privat .mini-item.done .mini-checkbox{border-color:var(--privat);background:var(--privat-bg);}
.content.bereich-privat .input-row button{background:var(--privat);}

.content.bereich-business h1.zt{color:var(--business);}
.content.bereich-business .input-row input:focus{border-bottom-color:var(--business);}
.content.bereich-business .mini-checkbox svg{stroke:var(--business);}
.content.bereich-business .mini-item.done .mini-checkbox{border-color:var(--business);background:var(--business-bg);}
.content.bereich-business .input-row button{background:var(--business);}

.content.bereich-uni h1.zt{color:var(--uni);}
.content.bereich-uni .input-row input:focus{border-bottom-color:var(--uni);}
.content.bereich-uni .mini-checkbox svg{stroke:var(--uni);}
.content.bereich-uni .mini-item.done .mini-checkbox{border-color:var(--uni);background:var(--uni-bg);}
.content.bereich-uni .input-row button{background:var(--uni);}
.confirm-row{display:flex;align-items:center;gap:8px;font-size:0.82rem;flex-shrink:0;}
.confirm-row button{border:none;border-radius:6px;padding:5px 11px;font-size:0.78rem;cursor:pointer;font-family:inherit;}
.confirm-yes{background:var(--danger);color:#fff;} .confirm-no{background:#EDE2E5;color:var(--ink);}
.divider{height:1px;background:var(--line);margin:4px 0 18px;}
.empty-lists{padding:40px 4px;text-align:center;color:var(--ink-soft);font-style:italic;}
.empty-lists button{margin-top:14px;border:none;background:var(--ink);color:#fff;padding:9px 18px;border-radius:8px;font-family:inherit;cursor:pointer;}

.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.ov-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;transition:.15s;}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.08);}
.ov-card-icon{font-size:1.3rem;margin-bottom:6px;}
.ov-card-title{font-family:'Fraunces',serif;font-weight:600;font-size:1rem;margin-bottom:4px;}
.ov-card-sub{font-size:0.76rem;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}

/* generic mini checklist (used in checklist / month columns / trip days) */
.input-row{display:flex;gap:8px;margin-bottom:10px;}
.input-row input{flex:1;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:0.95rem;
  color:var(--ink);padding:6px 2px;outline:none;font-family:inherit;}
.input-row input:focus{border-bottom-color:var(--ink);}
.input-row button{border:none;background:var(--ink);color:#fff;width:28px;height:28px;border-radius:50%;
  font-size:1.05rem;cursor:pointer;flex-shrink:0;}
ul.mini-list{list-style:none;margin:0;padding:0;}
.mini-item{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid #EFE8D8;}
.mini-item:last-child{border-bottom:none;}
.mini-checkbox{width:16px;height:16px;border:2px solid var(--ink-soft);border-radius:4px;flex-shrink:0;cursor:pointer;
  position:relative;margin-top:2px;}
.mini-checkbox svg{position:absolute;inset:-3px;stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:.2s;}
.mini-item.done .mini-checkbox{border-color:var(--ink);background:#00000008;}
.mini-item.done .mini-checkbox svg{stroke-dashoffset:0;}
.mini-text{flex:1;font-size:0.9rem;overflow-wrap:break-word;word-break:break-word;line-height:1.4;}
.mini-item.done .mini-text{color:var(--ink-soft);text-decoration:line-through;}
.mini-del{border:none;background:none;color:var(--ink-soft);font-size:1.05rem;cursor:pointer;opacity:.4;padding:2px 5px;flex-shrink:0;}
.mini-del:hover{color:var(--danger);opacity:1;}
.empty-mini{color:var(--ink-soft);font-size:0.85rem;font-style:italic;padding:4px 0;}

/* checklist view */
.footer-count{margin-top:14px;font-size:0.75rem;color:var(--ink-soft);}

/* month view */
.month-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.month-col{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;}
.month-col h3{font-family:'Fraunces',serif;font-size:1rem;margin:0 0 10px;display:flex;align-items:center;gap:6px;}
.month-col.privat h3{color:var(--privat);} .month-col.sport h3{color:var(--business);} .month-col.business h3{color:var(--uni);}
@media(max-width:720px){.month-cols{grid-template-columns:1fr;}}

/* trip view */
.trip-range{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:18px;
  font-family:'IBM Plex Mono',monospace;font-size:0.85rem;color:var(--ink-soft);}
.day-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.day-card h4{font-family:'Fraunces',serif;font-size:0.98rem;margin:0 0 8px;color:var(--ink);}

/* idea board */
.ib-inbox{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;}
.ib-inbox textarea{width:100%;min-height:80px;resize:vertical;border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;font-family:inherit;font-size:0.9rem;background:#fff;color:var(--ink);line-height:1.5;}
.ib-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.ib-btn{font-family:inherit;font-size:0.85rem;font-weight:500;border:none;border-radius:7px;padding:8px 14px;cursor:pointer;}
.ib-btn.primary{background:var(--business);color:#fff;}
.ib-btn.primary:disabled{opacity:.5;}
.ib-status{font-size:0.78rem;color:var(--ink-soft);font-style:italic;}
.ib-status.err{color:var(--danger);}
.ib-quick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:20px;}
.ib-quick input[type=text]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
  font-size:0.88rem;font-family:inherit;background:#fff;}
.ib-quick select{border:1px solid var(--line);border-radius:7px;padding:8px 8px;font-family:inherit;font-size:0.85rem;background:#fff;}
.ib-board{column-width:260px;column-gap:16px;}
.ib-card{background:var(--card);border:1px solid var(--line);border-radius:2px 10px 10px 10px;padding:14px 14px 12px;
  margin:0 0 16px;break-inside:avoid;position:relative;}
.ib-tab{position:absolute;top:-10px;left:12px;padding:2px 9px;border-radius:6px 6px 0 0;font-family:'IBM Plex Mono',monospace;
  font-size:9.5px;letter-spacing:.05em;color:#fff;}
.ib-card-head{display:flex;justify-content:space-between;align-items:baseline;margin:5px 0 8px;padding-bottom:6px;
  border-bottom:1px dashed var(--line);}
.ib-card-title{font-family:'Fraunces',serif;font-weight:600;font-size:0.95rem;}
.ib-card-count{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);}
.ib-card-del{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;padding:0 0 0 6px;}
.ib-card-del:hover{color:var(--danger);}
.newcat-box{display:none;gap:8px;margin-top:8px;flex-wrap:wrap;}
.newcat-box.show{display:flex;}
.newcat-box input{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:0.85rem;background:#fff;}
.newcat-box input.emoji{width:52px;text-align:center;}

@media(max-width:680px){
  .app{flex-direction:column;}
  .sidebar{width:100%;max-height:36vh;}
  .zettel-list{flex:1;}
  .main-scroll{padding:20px 18px;}
}

.save-toast{
  position:fixed;bottom:18px;right:18px;z-index:999;
  background:var(--sidebar-bg);color:#fff;
  font-family:'IBM Plex Sans',sans-serif;font-size:0.82rem;
  padding:8px 14px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);
  opacity:0;transform:translateY(6px);pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.save-toast.show{opacity:1;transform:translateY(0);}
.save-toast.err{background:var(--danger);}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header"><span class="sidebar-title">Notizblock</span></div>
    <div class="filter-chips" id="filter-chips"></div>
    <div class="pinned" id="pinned-ideaboard">
      <div class="pinned-title">📇 Idee-Board</div>
      <div class="pinned-sub">automatisch einsortiert</div>
    </div>
    <div class="add-row"><button class="add-btn-full" id="show-new-form">+ Neuer Zettel</button></div>
    <div class="new-form" id="new-form">
      <input type="text" id="nf-title" placeholder="Titel" maxlength="50">
      <select id="nf-type">
        <option value="checklist">Checkliste</option>
        <option value="month">Monatsübersicht</option>
        <option value="trip">Reiseplan</option>
      </select>
      <div class="bereich-picker" id="nf-bereich-picker">
        <button type="button" class="bp-btn privat" data-val="privat">Privat</button>
        <button type="button" class="bp-btn business" data-val="business">Business</button>
        <button type="button" class="bp-btn uni" data-val="uni">Uni</button>
        <button type="button" class="bp-btn none active" data-val="">kein Bereich</button>
      </div>
      <div class="daterow" id="nf-daterow" style="display:none;">
        <input type="date" id="nf-datefrom">
        <input type="date" id="nf-dateto">
      </div>
      <button class="new-form-confirm" id="nf-confirm">Anlegen</button>
    </div>
    <div class="zettel-list" id="zettel-list"></div>
    <div class="sidebar-footer">
      <div class="backup-row">
        <button class="backup-btn" id="export-btn">⬇ Exportieren</button>
        <button class="backup-btn" id="import-btn">⬆ Importieren</button>
        <input type="file" id="import-file" accept=".json" style="display:none;">
      </div>
    </div>
  </aside>
  <main class="main"><div class="main-scroll"><div class="content" id="main-content"></div></div></main>
</div>
<div class="save-toast" id="save-toast"></div>
<script>
/* Storage-Shim: bildet die window.storage-API (aus der Sandbox-Vorschau) auf echtes
   localStorage ab, damit der restliche Code unveraendert bleibt. Spaeter wird hier
   der OneDrive-Sync eingehaengt, ohne den Rest der App anzufassen. */
window.storage = {
  async get(key){ const v = localStorage.getItem(key); return v===null ? null : {value:v}; },
  async set(key, value){ localStorage.setItem(key, value); },
  async delete(key){ localStorage.removeItem(key); }
};

const STORAGE_KEY = 'ultimativer-notizblock-v1';
const BEREICHE = {privat:{label:'Privat',color:'var(--privat)'},business:{label:'Business',color:'var(--business)'},uni:{label:'Uni',color:'var(--uni)'}};
const PALETTE = ['#2B6E6B','#4A5A8C','#C08A2E','#B5563A','#6B7A3A','#3E6B8C','#8A5A2E','#5A6B7A'];
let data = null;
let activeFilter = 'alle';
let confirmingDeleteId = null;
let pendingDeleteCat = null;

function uid(){return 'id'+Date.now()+Math.random().toString(36).slice(2,8);}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function fmtDate(ts){return new Date(ts).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'2-digit'});}
function fmtDay(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'});
}

function defaultData(){
  const uniListen = ['Termine','Stundenplan/Vorlesungen','Prüfungstermine','Lernplan/Vorbereitung'];
  const now = Date.now();
  const zettel = uniListen.map((title,i)=>({
    id: uid(), title, type:'checklist', bereich:'uni', createdAt: now - (uniListen.length - i), items: []
  }));
  zettel.push({ id: uid(), title:'Nächste Schritte PETIVO', type:'checklist', bereich:'business', createdAt: now, items: [] });
  return {
    ideaBoard:{categories:[],items:[]},
    zettel,
    activeId:'ideaboard'
  };
}

async function load(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    data = res ? JSON.parse(res.value) : defaultData();
  }catch(e){ data = defaultData(); }
  if(!data.activeId) data.activeId = 'ideaboard';
  renderAll();
}
async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
    showSaveToast('Gespeichert ✓', false);
  }catch(e){
    console.error('Speichern fehlgeschlagen', e);
    showSaveToast('Speichern fehlgeschlagen', true);
  }
}

let saveToastTimer = null;
function showSaveToast(msg, isErr){
  const el = document.getElementById('save-toast');
  if(!el) return;
  el.textContent = msg;
  el.className = 'save-toast show' + (isErr ? ' err' : '');
  clearTimeout(saveToastTimer);
  saveToastTimer = setTimeout(()=>{ el.classList.remove('show'); }, 1300);
}

function getSortedZettel(){
  return [...data.zettel].sort((a,b)=>b.createdAt-a.createdAt);
}
function getVisibleZettel(){
  const sorted = getSortedZettel();
  if(activeFilter==='alle') return sorted;
  return sorted.filter(z=>z.bereich===activeFilter);
}
function getActiveZettel(){
  return data.zettel.find(z=>z.id===data.activeId) || null;
}

function renderAll(){ renderSidebar(); renderMain(); }

/* ---------------- SIDEBAR ---------------- */
function renderSidebar(){
  // filter chips
  const chipsWrap = document.getElementById('filter-chips');
  chipsWrap.innerHTML = '';
  const chipDefs = [{key:'alle',label:'Alle'},{key:'privat',label:'Privat'},{key:'business',label:'Business'},{key:'uni',label:'Uni'}];
  chipDefs.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'chip'+(activeFilter===c.key?' active f-'+c.key:'');
    b.textContent = c.label;
    b.addEventListener('click',()=>{
      activeFilter=c.key;
      if(c.key!=='alle'){ data.activeId='bereich:'+c.key; renderAll(); persist(); }
      else { renderSidebar(); }
    });
    chipsWrap.appendChild(b);
  });

  // pinned idea board
  const pinned = document.getElementById('pinned-ideaboard');
  pinned.className = 'pinned'+(data.activeId==='ideaboard'?' active':'');

  // list
  const wrap = document.getElementById('zettel-list');
  wrap.innerHTML = '';
  const visible = getVisibleZettel();
  if(visible.length===0){
    wrap.innerHTML = '<div class="sidebar-empty">Noch keine Zettel in dieser Ansicht.</div>';
    return;
  }
  visible.forEach(z=>{
    const div = document.createElement('div');
    div.className = 'zettel-item'+(z.id===data.activeId?' active':'');
    const icon = z.type==='checklist' ? '✅' : z.type==='month' ? '📅' : '✈️';
    let dots;
    if(z.type==='month'){
      dots = '<span class="dot-row"><span class="dot privat"></span><span class="dot business"></span><span class="dot uni"></span></span>';
    } else {
      dots = `<span class="dot-row"><span class="dot ${z.bereich||'none'}"></span></span>`;
    }
    div.innerHTML = `
      <span class="type-icon">${icon}</span>
      ${dots}
      <div class="zettel-info">
        <div class="zettel-title">${escapeHtml(z.title)}</div>
        <div class="zettel-meta">${fmtDate(z.createdAt)}</div>
      </div>
    `;
    div.addEventListener('click',()=>{ data.activeId=z.id; confirmingDeleteId=null; renderAll(); persist(); });
    wrap.appendChild(div);
  });
}

document.getElementById('pinned-ideaboard').addEventListener('click',()=>{
  data.activeId='ideaboard'; renderAll(); persist();
});

/* ---------------- NEW ZETTEL FORM ---------------- */
document.getElementById('show-new-form').addEventListener('click',()=>{
  document.getElementById('new-form').classList.add('show');
  document.getElementById('nf-title').value='';
  selectedBereich = '';
  document.querySelectorAll('#nf-bereich-picker .bp-btn').forEach(b=>b.classList.toggle('active', b.dataset.val===''));
  document.getElementById('nf-title').focus();
});
document.getElementById('nf-type').addEventListener('change',(e)=>{
  document.getElementById('nf-daterow').style.display = e.target.value==='trip' ? 'flex' : 'none';
});
let selectedBereich = '';
document.getElementById('nf-bereich-picker').addEventListener('click',(e)=>{
  const btn = e.target.closest('.bp-btn'); if(!btn) return;
  selectedBereich = btn.dataset.val;
  document.querySelectorAll('#nf-bereich-picker .bp-btn').forEach(b=>b.classList.toggle('active', b===btn));
});
document.getElementById('nf-confirm').addEventListener('click', createZettelFromForm);

function createZettelFromForm(){
  const title = document.getElementById('nf-title').value.trim();
  const type = document.getElementById('nf-type').value;
  const bereich = selectedBereich || null;
  if(!title) return;
  const base = { id: uid(), title, type, bereich, createdAt: Date.now() };
  if(type==='checklist'){ base.items = []; }
  else if(type==='month'){ base.columns = {privat:[],sport:[],business:[]}; base.bereich=null; }
  else if(type==='trip'){
    const from = document.getElementById('nf-datefrom').value;
    const to = document.getElementById('nf-dateto').value;
    if(!from || !to){ alert('Bitte Zeitraum angeben.'); return; }
    base.dateFrom = from; base.dateTo = to;
    base.days = buildTripDays(from, to);
  }
  data.zettel.push(base);
  data.activeId = base.id;
  confirmingDeleteId = null;
  document.getElementById('new-form').classList.remove('show');
  renderAll(); persist();
}

function buildTripDays(from, to){
  const days = [];
  let cur = new Date(from+'T00:00:00');
  const end = new Date(to+'T00:00:00');
  while(cur <= end){
    const iso = cur.toISOString().slice(0,10);
    days.push({date: iso, items: []});
    cur.setDate(cur.getDate()+1);
  }
  return days;
}

/* ---------------- MAIN AREA DISPATCH ---------------- */
function renderMain(){
  const c = document.getElementById('main-content');
  if(data.activeId==='ideaboard'){ setContentBereichClass(null); renderIdeaBoard(c); return; }
  if(typeof data.activeId==='string' && data.activeId.startsWith('bereich:')){
    const key = data.activeId.split(':')[1];
    setContentBereichClass(key);
    renderBereichOverview(c, key);
    return;
  }
  const z = getActiveZettel();
  if(!z){
    setContentBereichClass(null);
    c.innerHTML = `<div class="empty-lists">Zettel nicht gefunden oder gelöscht.<div><button id="back-to-ib">Zum Idee-Board</button></div></div>`;
    document.getElementById('back-to-ib').addEventListener('click',()=>{data.activeId='ideaboard';renderAll();persist();});
    return;
  }
  setContentBereichClass(z.type==='month' ? null : z.bereich);
  if(z.type==='checklist') renderChecklist(c, z);
  else if(z.type==='month') renderMonth(c, z);
  else if(z.type==='trip') renderTrip(c, z);
}

function renderBereichOverview(c, key){
  const label = BEREICHE[key].label;
  const matching = getSortedZettel().filter(z => z.bereich===key || z.type==='month');
  let cardsHtml = '';
  if(matching.length===0){
    cardsHtml = `<div class="empty-lists">Noch keine Zettel für ${label}.<div><button id="ov-add-btn">+ Neuer ${label}-Zettel</button></div></div>`;
  } else {
    cardsHtml = '<div class="ov-grid">' + matching.map(z=>{
      const icon = z.type==='checklist' ? '✅' : z.type==='month' ? '📅' : '✈️';
      const countTxt = z.type==='checklist' ? `${z.items.filter(i=>!i.done).length} offen`
        : z.type==='trip' ? `${z.days.length} Tag(e)`
        : 'Fokus des Monats';
      return `<div class="ov-card" data-id="${z.id}">
        <div class="ov-card-icon">${icon}</div>
        <div class="ov-card-title">${escapeHtml(z.title)}</div>
        <div class="ov-card-sub">${countTxt} · ${fmtDate(z.createdAt)}</div>
      </div>`;
    }).join('') + '</div>';
  }
  c.innerHTML = `
    <div class="head-row"><div><h1 class="zt">${label}</h1><div class="head-meta">Übersicht</div></div></div>
    <div class="divider"></div>
    ${cardsHtml}
  `;
  c.querySelectorAll('.ov-card').forEach(card=>{
    card.addEventListener('click', ()=>{ data.activeId=card.dataset.id; renderAll(); persist(); });
  });
  const addBtn = document.getElementById('ov-add-btn');
  if(addBtn){
    addBtn.addEventListener('click', ()=>{
      document.getElementById('show-new-form').click();
      selectedBereich = key;
      document.querySelectorAll('#nf-bereich-picker .bp-btn').forEach(b=>b.classList.toggle('active', b.dataset.val===key));
    });
  }
}

function renderHeadRow(z){
  const isConfirming = confirmingDeleteId===z.id;
  const tag = z.bereich ? `<span class="bereich-tag ${z.bereich}">${BEREICHE[z.bereich].label}</span>` : '';
  return `
    <div class="head-row">
      <div><h1 class="zt">${escapeHtml(z.title)}${tag}</h1><div class="head-meta">angelegt ${fmtDate(z.createdAt)}</div></div>
      ${isConfirming ? `
        <div class="confirm-row">Löschen?
          <button class="confirm-yes" id="cf-yes">Ja</button>
          <button class="confirm-no" id="cf-no">Abbrechen</button>
        </div>` : `<button class="del-btn" id="del-zettel" aria-label="Löschen">🗑</button>`}
    </div><div class="divider"></div>
  `;
}
function setContentBereichClass(bereich){
  document.getElementById('main-content').className = 'content' + (bereich ? ' bereich-'+bereich : '');
}
function bindHeadRow(z){
  if(confirmingDeleteId===z.id){
    document.getElementById('cf-yes').addEventListener('click',()=>deleteZettel(z.id));
    document.getElementById('cf-no').addEventListener('click',()=>{confirmingDeleteId=null;renderMain();});
  } else {
    document.getElementById('del-zettel').addEventListener('click',()=>{confirmingDeleteId=z.id;renderMain();});
  }
}
function deleteZettel(id){
  data.zettel = data.zettel.filter(z=>z.id!==id);
  if(data.activeId===id) data.activeId='ideaboard';
  confirmingDeleteId=null;
  renderAll(); persist();
}

/* generic mini list renderer */
function renderMiniList(ul, items){
  ul.innerHTML='';
  if(items.length===0){ ul.innerHTML = '<div class="empty-mini">Noch nichts hier.</div>'; return; }
  items.forEach(it=>{
    const li=document.createElement('li');
    li.className='mini-item'+(it.done?' done':'');
    li.innerHTML=`<span class="mini-checkbox" data-id="${it.id}"><svg viewBox="0 0 18 18"><path d="M3 9l4 4 8-8"/></svg></span>
      <span class="mini-text">${escapeHtml(it.text)}</span>
      <button class="mini-del" data-id="${it.id}">×</button>`;
    ul.appendChild(li);
  });
}
function bindMiniList(ul, items, onChanged){
  ul.addEventListener('click',(e)=>{
    const cb=e.target.closest('.mini-checkbox'); const del=e.target.closest('.mini-del');
    if(cb){ const it=items.find(i=>i.id===cb.dataset.id); if(it){it.done=!it.done; onChanged();} }
    else if(del){ const idx=items.findIndex(i=>i.id===del.dataset.id); if(idx>-1){items.splice(idx,1); onChanged();} }
  });
}

/* ---------------- CHECKLIST VIEW ---------------- */
function renderChecklist(c, z){
  c.innerHTML = renderHeadRow(z) + `
    <div class="input-row"><input type="text" id="cl-input" placeholder="Neuer Punkt und Enter …" maxlength="200"><button id="cl-add">+</button></div>
    <ul class="mini-list" id="cl-list"></ul>
    <div class="footer-count" id="cl-count"></div>
  `;
  bindHeadRow(z);
  const ul = document.getElementById('cl-list');
  const refresh = ()=>{ renderMiniList(ul, z.items); updateCount(); persist(); };
  const updateCount = ()=>{
    const open=z.items.filter(i=>!i.done).length, done=z.items.length-open;
    document.getElementById('cl-count').textContent = z.items.length===0?'0 offen':`${open} offen · ${done} erledigt`;
  };
  renderMiniList(ul, z.items); updateCount();
  bindMiniList(ul, z.items, refresh);
  document.getElementById('cl-add').addEventListener('click',()=>addClItem());
  document.getElementById('cl-input').addEventListener('keydown',(e)=>{if(e.key==='Enter')addClItem();});
  function addClItem(){
    const inp=document.getElementById('cl-input'); const t=inp.value.trim(); if(!t)return;
    z.items.unshift({id:uid(),text:t,done:false}); inp.value=''; refresh();
  }
}

/* ---------------- MONTH VIEW ---------------- */
function renderMonth(c, z){
  c.innerHTML = renderHeadRow(z) + `
    <div class="month-cols">
      ${monthColHtml('privat','🏠 Privat')}
      ${monthColHtml('sport','🏃 Sport')}
      ${monthColHtml('business','💼 Business')}
    </div>
  `;
  bindHeadRow(z);
  ['privat','sport','business'].forEach(col=>{
    const ul = document.getElementById('mc-list-'+col);
    const refresh = ()=>{ renderMiniList(ul, z.columns[col]); persist(); };
    renderMiniList(ul, z.columns[col]);
    bindMiniList(ul, z.columns[col], refresh);
    document.getElementById('mc-add-'+col).addEventListener('click',()=>addMonthItem(col));
    document.getElementById('mc-input-'+col).addEventListener('keydown',(e)=>{if(e.key==='Enter')addMonthItem(col);});
  });
  function addMonthItem(col){
    const inp=document.getElementById('mc-input-'+col); const t=inp.value.trim(); if(!t)return;
    z.columns[col].unshift({id:uid(),text:t,done:false}); inp.value='';
    renderMiniList(document.getElementById('mc-list-'+col), z.columns[col]); persist();
  }
}
function monthColHtml(col,label){
  return `<div class="month-col ${col==='sport'?'business':col==='business'?'uni':'privat'}">
    <h3>${label}</h3>
    <div class="input-row"><input type="text" id="mc-input-${col}" placeholder="Fokus hinzufügen …" maxlength="150"><button id="mc-add-${col}">+</button></div>
    <ul class="mini-list" id="mc-list-${col}"></ul>
  </div>`;
}

/* ---------------- TRIP VIEW ---------------- */
function renderTrip(c, z){
  c.innerHTML = renderHeadRow(z) + `
    <div class="trip-range">${fmtDay(z.dateFrom)} → ${fmtDay(z.dateTo)} · ${z.days.length} Tag(e)</div>
    <div id="trip-days"></div>
  `;
  bindHeadRow(z);
  const wrap = document.getElementById('trip-days');
  z.days.forEach((day, idx)=>{
    const card = document.createElement('div');
    card.className='day-card';
    card.innerHTML = `
      <h4>Tag ${idx+1} — ${fmtDay(day.date)}</h4>
      <div class="input-row"><input type="text" placeholder="Was steht an …" maxlength="200"><button>+</button></div>
      <ul class="mini-list"></ul>
    `;
    const input = card.querySelector('input');
    const addBtn = card.querySelector('button');
    const ul = card.querySelector('ul');
    const refresh = ()=>{ renderMiniList(ul, day.items); persist(); };
    renderMiniList(ul, day.items);
    bindMiniList(ul, day.items, refresh);
    addBtn.addEventListener('click',()=>{ const t=input.value.trim(); if(!t)return; day.items.unshift({id:uid(),text:t,done:false}); input.value=''; refresh(); });
    input.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ const t=input.value.trim(); if(!t)return; day.items.unshift({id:uid(),text:t,done:false}); input.value=''; refresh(); }});
    wrap.appendChild(card);
  });
}

/* ---------------- IDEA BOARD ---------------- */
function renderIdeaBoard(c){
  c.innerHTML = `
    <div class="head-row"><div><h1 class="zt">📇 Idee-Board</h1><div class="head-meta">automatisch einsortiert</div></div></div>
    <div class="divider"></div>
    <div class="ib-inbox">
      <div class="ib-status" style="margin-bottom:8px;">Rohtext in einer Claude-Unterhaltung sortieren lassen, JSON-Antwort hier einfügen:</div>
      <textarea id="ib-import" placeholder='JSON-Antwort von Claude einfügen, z.B. [{"text":"...","category":"Steuern"}]'></textarea>
      <div class="ib-row"><button class="ib-btn primary" id="ib-import-btn">Einfügen</button><span class="ib-status" id="ib-sort-status"></span></div>
    </div>
    <div class="ib-quick">
      <input type="text" id="ib-quick-text" placeholder="…oder einzelnen Punkt direkt hinzufügen">
      <select id="ib-quick-cat"></select>
      <button class="ib-btn primary" id="ib-quick-add">Hinzufügen</button>
      <div class="newcat-box" id="ib-newcat-box">
        <input type="text" class="emoji" id="ib-newcat-emoji" placeholder="📌" maxlength="2">
        <input type="text" id="ib-newcat-title" placeholder="Name der Kategorie">
        <button class="ib-btn" style="background:#EDE2E5" id="ib-newcat-confirm">Anlegen</button>
      </div>
    </div>
    <div class="ib-board" id="ib-board"></div>
  `;
  renderIbBoard();
  renderIbCatSelect();
  document.getElementById('ib-import-btn').addEventListener('click', ibImportJson);
  document.getElementById('ib-quick-add').addEventListener('click', ibQuickAdd);
  document.getElementById('ib-quick-text').addEventListener('keydown',(e)=>{if(e.key==='Enter')ibQuickAdd();});
  document.getElementById('ib-quick-cat').addEventListener('change', ()=>{
    document.getElementById('ib-newcat-box').classList.toggle('show', document.getElementById('ib-quick-cat').value==='__new__');
  });
  document.getElementById('ib-newcat-confirm').addEventListener('click', ibConfirmNewCat);
}

function renderIbBoard(){
  const board = document.getElementById('ib-board');
  board.innerHTML='';
  const ib = data.ideaBoard;
  ib.categories.forEach(cat=>{
    const items = ib.items.filter(i=>i.categoryId===cat.id);
    const openCount = items.filter(i=>!i.done).length;
    const card = document.createElement('div');
    card.className='ib-card';
    card.innerHTML = `
      <div class="ib-tab" style="background:${cat.color}">${cat.emoji} ${escapeHtml(cat.title.toUpperCase())}</div>
      <div class="ib-card-head">
        <span class="ib-card-title">${cat.emoji} ${escapeHtml(cat.title)}</span>
        <span class="ib-card-count">${openCount} offen <button class="ib-card-del" data-id="${cat.id}">✕</button></span>
      </div>
      <div class="ib-items"></div>
    `;
    const itemsWrap = card.querySelector('.ib-items');
    if(items.length===0){ itemsWrap.innerHTML='<div class="empty-mini">Noch keine Einträge</div>'; }
    else {
      items.sort((a,b)=>(a.done===b.done)?0:(a.done?1:-1));
      items.forEach(it=>{
        const row=document.createElement('div');
        row.className='mini-item'+(it.done?' done':'');
        row.innerHTML=`<span class="mini-checkbox" data-id="${it.id}"><svg viewBox="0 0 18 18"><path d="M3 9l4 4 8-8"/></svg></span>
          <span class="mini-text">${escapeHtml(it.text)}</span>
          <button class="mini-del" data-id="${it.id}">×</button>`;
        itemsWrap.appendChild(row);
      });
    }
    itemsWrap.addEventListener('click',(e)=>{
      const cb=e.target.closest('.mini-checkbox'); const del=e.target.closest('.mini-del');
      if(cb){ const it=ib.items.find(i=>i.id===cb.dataset.id); if(it){it.done=!it.done; persist(); renderIbBoard();} }
      else if(del){ ib.items = ib.items.filter(i=>i.id!==del.dataset.id); persist(); renderIbBoard(); }
    });
    card.querySelector('.ib-card-del').addEventListener('click', ()=>ibDeleteCategory(cat.id));
    board.appendChild(card);
  });
}

function renderIbCatSelect(){
  const sel = document.getElementById('ib-quick-cat');
  const current = sel.value;
  sel.innerHTML='';
  data.ideaBoard.categories.forEach(c=>{
    const opt=document.createElement('option'); opt.value=c.id; opt.textContent=c.emoji+' '+c.title; sel.appendChild(opt);
  });
  const newOpt=document.createElement('option'); newOpt.value='__new__'; newOpt.textContent='+ Neue Kategorie…'; sel.appendChild(newOpt);
  if([...sel.options].some(o=>o.value===current)) sel.value=current;
}

function ibDeleteCategory(id){
  if(pendingDeleteCat!==id){
    pendingDeleteCat=id;
    document.getElementById('ib-sort-status').textContent='Nochmal auf ✕ tippen zum wirklich Löschen.';
    document.getElementById('ib-sort-status').className='ib-status err';
    setTimeout(()=>{if(pendingDeleteCat===id)pendingDeleteCat=null;},4000);
    return;
  }
  pendingDeleteCat=null;
  data.ideaBoard.categories = data.ideaBoard.categories.filter(c=>c.id!==id);
  data.ideaBoard.items = data.ideaBoard.items.filter(i=>i.categoryId!==id);
  persist(); renderIbBoard(); renderIbCatSelect();
}

function ibConfirmNewCat(){
  const emoji = document.getElementById('ib-newcat-emoji').value.trim() || '📌';
  const title = document.getElementById('ib-newcat-title').value.trim();
  if(!title) return;
  const color = PALETTE[data.ideaBoard.categories.length % PALETTE.length];
  const id = 'cat_'+uid();
  data.ideaBoard.categories.push({id,title,emoji,color});
  document.getElementById('ib-newcat-emoji').value='';
  document.getElementById('ib-newcat-title').value='';
  document.getElementById('ib-newcat-box').classList.remove('show');
  persist(); renderIbBoard(); renderIbCatSelect();
  document.getElementById('ib-quick-cat').value = id;
}

function ibQuickAdd(){
  const textEl = document.getElementById('ib-quick-text');
  const text = textEl.value.trim();
  const catSel = document.getElementById('ib-quick-cat').value;
  if(!text) return;
  if(catSel==='__new__'){ 
    document.getElementById('ib-sort-status').textContent='Erst Kategorie-Namen anlegen.';
    document.getElementById('ib-sort-status').className='ib-status err';
    return;
  }
  if(data.ideaBoard.categories.length===0){
    document.getElementById('ib-sort-status').textContent='Erst eine Kategorie anlegen.';
    return;
  }
  data.ideaBoard.items.push({id:uid(), categoryId:catSel, text, done:false});
  textEl.value='';
  persist(); renderIbBoard();
}

function ibImportJson(){
  const raw = document.getElementById('ib-import').value.trim();
  const statusEl = document.getElementById('ib-sort-status');
  if(!raw){ statusEl.textContent='Erst JSON einfügen.'; statusEl.className='ib-status err'; return; }
  try{
    const cleaned = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);
    if(!Array.isArray(parsed)) throw new Error('Erwartet ein JSON-Array.');
    let added=0;
    parsed.forEach(entry=>{
      if(!entry || !entry.text) return;
      let catId;
      const title = (entry.category||'').trim();
      if(title){
        const existing = data.ideaBoard.categories.find(c=>c.title.toLowerCase()===title.toLowerCase());
        if(existing){ catId = existing.id; }
        else {
          catId = 'cat_'+uid();
          data.ideaBoard.categories.push({id:catId,title,emoji:entry.emoji||'📌',color:PALETTE[data.ideaBoard.categories.length % PALETTE.length]});
        }
      }
      if(!catId){
        if(data.ideaBoard.categories.length===0) return;
        catId = data.ideaBoard.categories[0].id;
      }
      data.ideaBoard.items.push({id:uid(),categoryId:catId,text:entry.text,done:false});
      added++;
    });
    persist();
    renderIbBoard(); renderIbCatSelect();
    document.getElementById('ib-import').value='';
    statusEl.textContent = `${added} Punkt(e) übernommen.`;
    statusEl.className='ib-status';
  }catch(e){
    statusEl.textContent = 'Import fehlgeschlagen: ' + (e.message||e);
    statusEl.className='ib-status err';
  }
}

/* ---------------- EXPORT / IMPORT ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`notizblock-sicherung-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.zettel)) throw new Error('Ungültiges Format');
      data = parsed;
      confirmingDeleteId=null; pendingDeleteCat=null;
      renderAll(); persist();
    }catch(err){ alert('Diese Datei sieht nicht wie eine gültige Sicherung aus.'); }
  };
  reader.readAsText(file);
}
document.getElementById('export-btn').addEventListener('click', exportData);
document.getElementById('import-btn').addEventListener('click', ()=>document.getElementById('import-file').click());
document.getElementById('import-file').addEventListener('change',(e)=>{
  const f = e.target.files[0]; if(f) importData(f); e.target.value='';
});

load();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/sw.js').catch(e=>console.error('SW-Registrierung fehlgeschlagen', e)); });
}
